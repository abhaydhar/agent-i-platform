version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aip-postgres
    environment:
      POSTGRES_DB: aip
      POSTGRES_USER: aip_user
      POSTGRES_PASSWORD: aip_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aip_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aip-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://aip_user:aip_password@postgres:5432/aip
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEO4J_URI: ${NEO4J_URI:-neo4j://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/backend/src
    command: npm run dev --workspace=backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aip-frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:

networks:
  default:
    name: aip-network
